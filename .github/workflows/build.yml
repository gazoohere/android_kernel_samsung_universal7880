name: Focus-RS-Final-V29

on:
  workflow_dispatch:

jobs:
  build:
    # 20.04: Paket yollarının en stabil olduğu liman.
    runs-on: ubuntu-20.04

    steps:
      - name: 1. Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: 2. Sistemi ve Derleyiciyi Hazırla
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev python2 ccache
          
          # Python 2 ayarı
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # KRİTİK: Ccache kâbusunu bitiren "Sahte Ccache" operasyonu
          # Sistemde ccache diye bir şey kalmayacak, hepsi bizim derleyicimiz olacak
          sudo rm -f /usr/bin/ccache
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/bin/ccache
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/local/bin/ccache
          
          # Derleyici ismini mühürle
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/bin/aarch64-linux-gnu-gcc

      - name: 3. KernelSU ve Kod Onarımı
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Werror ve implicit declaration katılıklarını gevşet
          find . -type f -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g'
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          
          # DTS Temizliği
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: 4. Derleme (Focus RS Edition)
        run: |
          export ARCH=arm64
          # Makefile içindeki ccache arayışını durdurmak için
