name: Focus RS Kernel Build (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    # Kararlılık için 22.04 sürümüne sabitliyoruz (Daha iyi uyumluluk)
    runs-on: ubuntu-22.04
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: Derleme Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev ccache python3 python3-dev
          # Python 2 eksikliğini simüle et (Kernel scripts için)
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Akıllı Onarım ve KernelSU
        run: |
          # KernelSU Kurulumu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # KRİTİK TAMİR: 'proc.S' ve 'vdso' hatalarını kökten çözer.
          # Sadece satır sonundaki veya boşluklu '#' işaretlerini (yorumları) temizler.
          # İşlemci sabitlerine (#1, #0x10 vb.) dokunmaz.
          find . -type f -name "*.S" -exec sed -i 's/\s#\([^0-9x]\)/ \/\/ \1/g' {} +
          find . -type f -name "*.S" -exec sed -i 's/^[[:space:]]*#/\/\/ /g' {} +
          
          # Makefile ve Werror temizliği
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          find . -type f -name "Kbuild" -o -name "Makefile" | xargs sed -i 's/-Werror//g'
          
          # DTS Yaması (A7 2017 özel dosyası)
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Kernel'ı Derle
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export USE_CCACHE=0
          
          make rise-a7y17lte_defconfig
          # KCFLAGS ve KCPPFLAGS ile tüm gereksiz uyarıları susturuyoruz
          make -j$(nproc) KCFLAGS="-w" KCPPFLAGS="-w"

      - name: Kernel Dosyasını Paketle
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel
          path: arch/arm64/boot/Image.gz-dtb
