name: Focus RS Kernel Build (KernelSU)

on:
  workflow_dispatch: # Manuel başlatma butonu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Derleme Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev

      - name: KernelSU Entegre Et ve Hataları Otomatik Onar
        run: |
          # KernelSU Kurulumu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Daha önce bizi yoran Netfilter hatalarını temizle
          find . -type f -name "Kbuild" -o -name "Makefile" | xargs sed -i 's/-Werror//g'
          
          # DTS Hatalarını (common.dtsi eksikliği) bypass et
          # Hatalı satırı tüm dts dosyalarından siliyoruz
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Kernel'ı Derle
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Senin cihazının config dosyasını kullanıyoruz
          make exynos7880-a7y17lte_eur_open_defconfig
          
          # Derlemeyi başlat (Hız için tüm çekirdekleri kullan)
          make -j$(nproc) KCFLAGS="-w"

      - name: Kernel Dosyasını Pakatle (Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: Focus-RS-Kernel
          path: arch/arm64/boot/Image.gz-dtb
