name: Focus RS Kernel Build (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Daha hızlı sıra gelmesi için en güncel sistemi seçtik
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: Derleme Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev ccache python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Otomatik Tamir ve KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          # Yazım hatasını düzelt
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          # Uyarıları sustur
          find . -type f -name "Kbuild" -o -name "Makefile" | xargs sed -i 's/-Werror//g'
          # DTS hatasını bypass et
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Kernel'ı Derle
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # GÖRÜNTÜDEN TEYİT ETTİĞİMİZ KESİN AD:
          make rise-a7y17lte_defconfig
          # KCFLAGS="-w" ile derlemeye başla
          make -j$(nproc) KCFLAGS="-w"

      - name: Kernel Dosyasını Paketle
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel
          path: arch/arm64/boot/Image.gz-dtb
