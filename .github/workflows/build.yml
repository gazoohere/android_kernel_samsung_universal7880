name: Focus-RS-Perfect-Build

on:
  workflow_dispatch:

jobs:
  build:
    # 18.04: Bu kernelin en sevdiği, her şeyin "yerli yerinde" olduğu en temiz ortam.
    runs-on: ubuntu-18.04

    steps:
      - name: 1. Kaynak Kodları İndir
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: 2. Gerekli Araçları Kur (GCC 9 ve Python 2)
        run: |
          sudo apt-get update
          # Kernelin derlenmesi için gereken temel paketler
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev python
          
          # Ccache belasından kurtulmak için sisteme derleyiciyi doğrudan tanıtıyoruz
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/bin/aarch64-linux-gnu-gcc

      - name: 3. KernelSU ve Kod Onarımı
        run: |
          # KernelSU entegrasyonu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Makefile içindeki 'hataları durdur' (Werror) özelliğini kapatıyoruz
          # Bu sayede küçük yazım uyarıları derlemeyi yarıda kesmez.
          find . -type f -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g'
          
          # Cihaz ağacı (DTS) çakışmalarını temizle
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: 4. Kernel'ı Derle (Focus RS Edition)
        run: |
          export ARCH=arm64
          # Derleyici ön ekini tanımlıyoruz (Sistem GCC 9'u buradan tanıyacak)
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Konfigürasyon dosyasını oluştur
          make rise-a7y17lte_defconfig
          
          # Motoru ateşle: Tüm işlemci gücünü kullan (-j$(nproc))
          # Gereksiz uyarıları gizle (-w)
          make -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w" KCPPFLAGS="-w"

      - name: 5. Tamamlanan Kernel'ı Teslim Et
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel-Final
          path: arch/arm64/boot/Image.gz-dtb
