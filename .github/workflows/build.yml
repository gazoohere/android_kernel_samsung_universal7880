name: Focus-RS-Final-Build

on:
  workflow_dispatch:

jobs:
  build:
    # 22.04: Kuyrukta bekletmez (Hızlı) ve Python 2'yi hala destekler (Uyumlu)
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Kaynak Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: 2. Sistemi ve Eksik Parçaları Hazırla
        run: |
          sudo apt-get update
          # Gereksiz araçları (ccache gibi) pasif bırakıp doğrudan ana silahlarımızı kuruyoruz
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev python2
          
          # Python 2'yi sistemde 'python' olarak mühürle (Hayati önemde)
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # Derleyicinin yolunu PATH'e zorla ekle (Bulunamadı hatasını bitirir)
          echo "/usr/bin" >> $GITHUB_PATH

      - name: 3. KernelSU ve Kod Onarımı
        run: |
          # KernelSU kurulumu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Derlemeyi durduran 'Werror' ve 'implicit declaration' katılıklarını gevşetiyoruz
          # Böylece yazım hataları yüzünden motor durmaz, sadece uyarı verir
          find . -type f -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g'
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          
          # Cihaz uyumluluğu için hatalı DTS dosyasını kaldır
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: 4. Motoru Ateşle (Doğrudan GCC 9 İle)
        run: |
          export ARCH=arm64
          # Derleyici yolunu hem export hem de make içinde net olarak belirtiyoruz
          export CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-gcc-9
          
          # Ccache'i tamamen devre dışı bırakıyoruz (Hata vermemesi için)
          export USE_CCACHE=0
          
          # Konfigürasyonu hazırla
          make rise-a7y17lte_defconfig
          
          # Derlemeye başla: Gereksiz tüm uyarıları sustur (-w)
          make -j$(nproc) CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-gcc-9 KCFLAGS="-w" KCPPFLAGS="-w"

      - name: 5. Kernel Dosyasını Paketle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel-Result
          path: arch/arm64/boot/Image.gz-dtb
