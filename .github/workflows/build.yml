name: Focus RS Kernel Build (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: Eski Tip Derleyiciyi ve Python'u Hazırla
        run: |
          sudo apt-get update
          # GCC 9 (eski ama uyumlu) ve Python 2 kurulumu
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev ccache python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: KernelSU Kurulumu
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # DİKKAT: Kodları bozan tüm 'sed' komutlarını sildim!
          # Sadece derlemeyi durduran gereksiz sert uyarıları (Werror) kapatıyoruz.
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          find . -type f -name "Kbuild" -o -name "Makefile" | xargs sed -i 's/-Werror//g'
          
          # DTS Yaması
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Kernel'ı Derle
        run: |
          export ARCH=arm64
          # Burası kritik: Standart aarch64 yerine kurduğumuz GCC-9'u kullanıyoruz
          export CROSS_COMPILE=aarch64-linux-gnu-gcc-9 
          # Eğer yukarıdaki isim hata verirse aarch64-linux-gnu- olarak deneriz ama genelde budur.
          
          make rise-a7y17lte_defconfig
          make -j$(nproc) KCFLAGS="-w" KCPPFLAGS="-w"

      - name: Kernel Dosyasını Paketle
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel
          path: arch/arm64/boot/Image.gz-dtb
