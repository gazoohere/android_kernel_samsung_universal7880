name: Focus-RS-Turbo-Build

on:
  workflow_dispatch:

jobs:
  build:
    # 22.04 hem hızlıdır (kuyruk beklemezsin) hem de çok stabildir.
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: 2. Sistemi ve Eksiksiz Parçaları Hazırla
        run: |
          sudo apt-get update
          # ccache dahil tüm araçları kuruyoruz ama ccache'in hata yapmasına izin vermeyeceğiz
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev python2 ccache
          
          # Python 2'yi sistemin varsayılanı yap (Scriptler için hayati)
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # KRİTİK: Ccache hatasını bitiren hamle
          # Eğer Makefile inatla 'ccache' ararsa, ona gerçek derleyicimizi ccache ismiyle sunuyoruz
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/bin/ccache
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/local/bin/ccache

      - name: 3. KernelSU ve Kod Onarımı
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Derlemeyi durduran Werror kurallarını esnet (Logların kirlenmesini önler)
          find . -type f -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g'
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          
          # DTS Uyumluluk Yaması
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: 4. Motoru Ateşle (Ubuntu 22.04 Gücüyle)
        run: |
          export ARCH=arm64
          # Makefile'ın doğru derleyiciyi bulması için tam yolu gösteriyoruz
          export CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-gcc-9
          
          # Konfigürasyonu yükle
          make rise-a7y17lte_defconfig
          
          # Derleme: CROSS_COMPILE değerini komutun içinde de vererek sağlama alıyoruz
          # -j$(nproc) ile tüm çekirdekleri kullanıyoruz, Focus RS çok hızlı pişecek!
          make -j$(nproc) CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-gcc-9 KCFLAGS="-w" KCPPFLAGS="-w"

      - name: 5. Sonucu Paketle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel-Final
          path: arch/arm64/boot/Image.gz-dtb
