name: Focus RS Kernel Build (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: Derleme Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev

      - name: Otomatik Tamir ve Temizlik
        run: |
          # KernelSU Kurulumu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # HATA 1: Makefile içindeki inatçı ccache referanslarını siliyoruz
          find . -type f -name "Makefile" -exec sed -i 's/ccache //g' {} +
          
          # HATA 2: Yazım hatasını düzeltiyoruz (-implicit -> -Wimplicit)
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          
          # HATA 3: Netfilter ve DTS yamaları
          find . -type f -name "Kbuild" -o -name "Makefile" | xargs sed -i 's/-Werror//g'
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Kernel'ı Derle
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Mevcut config dosyalarını listele (Loglarda görmek için)
          ls arch/arm64/configs/
          
          # Senin cihazın için en muhtemel config adını deniyoruz
          # Not: Eğer hata verirse loglardan gerçek dosya adına bakacağız
          make a7y17lte_eur_open_defconfig || make exynos7880-a7y17lte_eur_open_defconfig || make universal7880_defconfig
          
          # Derlemeyi başlat
          make -j$(nproc) KCFLAGS="-w"

      - name: Kernel Dosyasını Paketle
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel
          path: arch/arm64/boot/Image.gz-dtb
