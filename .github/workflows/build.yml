name: Focus-RS-Final-V28

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: Sistemi Hazırla
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev python2 ccache
          
          # Python 2'yi varsayılan yap
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # KRİTİK: ccache hatasını bitirmek için sistemi 'ccache' varmış gibi kandırıyoruz
          # Derleyiciyi ccache adıyla sistem yollarına kopyalıyoruz
          sudo cp /usr/bin/aarch64-linux-gnu-gcc-9 /usr/bin/ccache
          sudo cp /usr/bin/aarch64-linux-gnu-gcc-9 /usr/local/bin/ccache

      - name: KernelSU ve Yama
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Hataları durduran Werror kurallarını esnet
          find . -type f -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g'
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          
          # DTS Temizliği
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Derleme
        run: |
          export ARCH=arm64
          # Derleyiciyi tam yol ile vererek Makefile'ı zorluyoruz
          export CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-gcc-9
          
          make rise-a7y17lte_defconfig
          
          # Derlemeyi ateşle: CROSS_COMPILE'ı burada tekrar tanımlamak en güvenlisidir
          make -j$(nproc) CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-gcc-9 KCFLAGS="-w" KCPPFLAGS="-w"

      - name: Dosyayı Yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel
          path: arch/arm64/boot/Image.gz-dtb
