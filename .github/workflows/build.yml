name: Focus RS Kernel Build (Final Precision)

on:
  workflow_dispatch:

jobs:
  build:
    # 22.04: Hız ve Python2 desteği için en dengeli sürüm
    runs-on: ubuntu-22.04
    
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: Sistemi ve Bağımlılıkları Hazırla
        run: |
          sudo apt-get update
          # Temel derleme araçları ve GCC 9 serisi
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev python2 python3
          
          # Python 2'yi sistem geneline 'python' olarak mühürle
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # Ccache hatasını engellemek için derleyiciyi PATH'e açıkça ekle
          echo "/usr/bin" >> $GITHUB_PATH

      - name: KernelSU ve Kod Temizliği
        run: |
          # KernelSU entegrasyonu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Derlemeyi durduran katı uyarıları kapat (Werror = Error olmasın)
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          find . -type f -name "Kbuild" -o -name "Makefile" | xargs sed -i 's/-Werror//g'
          
          # DTS Yaması: Cihazın açılması için gereken dtsi temizliği
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Kernel Derleme (Focus RS Edition)
        run: |
          # Değişkenleri yerel olarak tanımla (PATH karmaşasını önler)
          export ARCH=arm64
          export CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-gcc-9
          
          # Konfigürasyonu yükle
          make rise-a7y17lte_defconfig
          
          # Ccache'i bypass et ve doğrudan derle (Hata payını sıfıra indirir)
          # KCFLAGS="-w" ile tüm yazım uyarılarını sustur, sadece sonuca odaklan
          make -j$(nproc) CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-gcc-9 KCFLAGS="-w" KCPPFLAGS="-w"

      - name: Kernel'ı Teslim Et
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel-Final
          path: arch/arm64/boot/Image.gz-dtb
