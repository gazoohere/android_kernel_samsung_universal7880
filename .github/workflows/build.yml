name: Focus RS Kernel Build (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    # Eski Android kernelleri için en stabil fabrika ortamı
    runs-on: ubuntu-20.04
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: Derleme Araçlarını Kur
        run: |
          sudo apt-get update
          # Ubuntu 20.04'te Python 2 yerleşik gelir, sahte linklere gerek yok!
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev ccache python2 python3
          # Kernel scriptleri python'u çağırır, biz onu orijinal python2'ye yönlendiriyoruz
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Temizlik ve KernelSU Kurulumu
        run: |
          # KernelSU Kurulumu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # HATA YAPAN SED KOMUTLARI KALDIRILDI! Kodlar orijinal haliyle derlenecek.
          
          # Makefile ve Werror temizliği (Sadece uyarıları hataya çevirmeyi engeller)
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          find . -type f -name "Kbuild" -o -name "Makefile" | xargs sed -i 's/-Werror//g'
          
          # DTS Yaması
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Kernel'ı Derle
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export USE_CCACHE=0
          
          make rise-a7y17lte_defconfig
          # Gereksiz uyarıları susturup saf derleme yapıyoruz
          make -j$(nproc) KCFLAGS="-w" KCPPFLAGS="-w"

      - name: Kernel Dosyasını Paketle
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel
          path: arch/arm64/boot/Image.gz-dtb
