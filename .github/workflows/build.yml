name: Focus RS Kernel Build (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: Derleme Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev ccache python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Derin Temizlik ve KernelSU
        run: |
          # KernelSU Kurulumu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # KRİTİK TAMİR: Ekran görüntüsündeki 'gettimeofday.S' ve tüm '.S' hatalarını çözer.
          # Yorum karakterlerini modern derleyicinin anlayacağı şekle çeviriyoruz.
          find . -type f -name "*.S" -exec sed -i 's/ #/;/g' {} +
          find . -type f -name "*.S" -exec sed -i 's/\/\//;/g' {} +
          
          # Makefile uyarılarını ve sert hataları (Werror) kapat
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          find . -type f -name "Kbuild" -o -name "Makefile" | xargs sed -i 's/-Werror//g'
          
          # DTS Yaması (Eksik dosya hatasını önler)
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Kernel'ı Derle
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make rise-a7y17lte_defconfig
          # KCFLAGS="-w" (Hataları sustur) ve KCPPFLAGS (Önişlemciyi sustur)
          make -j$(nproc) KCFLAGS="-w" KCPPFLAGS="-w"

      - name: Kernel Dosyasını Paketle
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel
          path: arch/arm64/boot/Image.gz-dtb
