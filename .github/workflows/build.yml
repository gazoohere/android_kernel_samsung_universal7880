name: Focus RS Kernel Build (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4
        with:
          ref: rise

      - name: Derleme Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex libelf-dev

      - name: Otomatik Cerrahi Müdahale ve KernelSU
        run: |
          # KernelSU Kurulumu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # HATA 1: Makefile içindeki yazım hatasını düzeltiyoruz
          find . -type f -name "Makefile" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          
          # HATA 2: Daha önce bizi yoran Netfilter/DTS hatalarını temizle
          find . -type f -name "Kbuild" -o -name "Makefile" | xargs sed -i 's/-Werror//g'
          find arch/arm64/boot/dts/ -type f -name "*.dts*" -exec sed -i '/exynos7880-a7y17lte_common.dtsi/d' {} +

      - name: Kernel'ı Derle
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Hangi config'in olduğunu bulup otomatik seçiyoruz
          CONF=$(ls arch/arm64/configs/ | grep -i "eur_open" | head -n 1)
          echo "Kullanılan Config: $CONF"
          make $CONF
          
          # Derlemeye başla
          make -j$(nproc) KCFLAGS="-w"

      - name: Kernel Dosyasını Paketle
        uses: actions/upload-artifact@v4
        with:
          name: Focus-RS-Kernel
          path: arch/arm64/boot/Image.gz-dtb
